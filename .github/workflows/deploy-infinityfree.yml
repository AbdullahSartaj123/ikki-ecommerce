name: IKKI — Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ikki-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build static website
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          echo "Static export generated successfully."

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikki-static-site
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Manual deployment to InfinityFree
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: ikki-static-site
          path: ./out/

      - name: Deploy website files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
