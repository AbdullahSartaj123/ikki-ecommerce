<path d="M0 720c160-100 280-30 395 75 105 96 236 121 605 22v383H0Z" fill="#f9f2e7" opacity=".62"/>
<path d="M-80 895c180-145 305-104 424 4 118 108 246 129 432 65 100-34 178-75 280-55v291H-80Z" fill="#fffaf1" opacity=".75"/>
<path d="M0 1065c202-80 290-16 432 42 154 62 308 28 568-83v176H0Z" fill="#d8c4a4" opacity=".3"/>
<!-- botanical silhouette -->
<g fill="none" stroke="#7d8557" stroke-width="5" stroke-linecap="round" opacity=".7">
 <path d="M820 0c-12 116 17 190 78 263 44 52 65 99 74 168"/>
 <path d="M864 119c-53-34-82-73-86-119M890 177c62-21 91-59 110-111M916 243c-44-7-76 4-111 34"/>
</g>
<g fill="#a9a77b" opacity=".7">
