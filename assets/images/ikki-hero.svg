<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
<title id="title">IKKI signature fragrance — luxury campaign artwork</title>
<desc id="desc">A clear glass IKKI perfume bottle with a black cap, abstract teal label, sculpted stone pedestal, ivory silk, botanical details and champagne-gold light.</desc>
<defs>
 <linearGradient id="back" x2="1" y2="1"><stop stop-color="#fbf7ef"/><stop offset=".48" stop-color="#eee1cd"/><stop offset="1" stop-color="#d9c4a3"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fffdf8" stop-opacity=".95"/><stop offset=".55" stop-color="#ead8b8" stop-opacity=".42"/><stop offset="1" stop-color="#c5a16d" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".16" stop-color="#d9e0dc" stop-opacity=".32"/><stop offset=".48" stop-color="#fff" stop-opacity=".76"/><stop offset=".8" stop-color="#c2b9a9" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient>
 <linearGradient id="liquid" x2="0" y2="1"><stop stop-color="#f5e4c6" stop-opacity=".3"/><stop offset="1" stop-color="#b58b50" stop-opacity=".35"/></linearGradient>
 <linearGradient id="cap" x2="1"><stop stop-color="#090909"/><stop offset=".25" stop-color="#38332e"/><stop offset=".55" stop-color="#080808"/><stop offset=".82" stop-color="#302b26"/><stop offset="1" stop-color="#050505"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#8d6837"/><stop offset=".5" stop-color="#e7ce9d"/><stop offset="1" stop-color="#a77d46"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#164f50"/><stop offset=".48" stop-color="#0a7775"/><stop offset="1" stop-color="#123b3d"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#f4ecdf"/><stop offset="1" stop-color="#cdbb9e"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="grain" width="70" height="70" patternUnits="userSpaceOnUse"><circle cx="12" cy="15" r="1" fill="#9e825b" opacity=".12"/><circle cx="48" cy="52" r=".8" fill="#9e825b" opacity=".1"/></pattern>
</defs>
<rect width="1000" height="1200" fill="url(#back)"/>
<rect width="1000" height="1200" fill="url(#grain)"/>
<ellipse cx="530" cy="480" rx="480" ry="510" fill="url(#sun)"/>
