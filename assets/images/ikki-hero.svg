</g>
<!-- jasmine blossom -->
<g transform="translate(890 305)" fill="#fffdf7" stroke="#d9c7a9" stroke-width="2">
 <ellipse cy="-25" rx="15" ry="32"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(72)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(144)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(216)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(288)"/><circle r="10" fill="#d9b86f" stroke="none"/>
</g>
<g transform="translate(125 290) scale(.72)" fill="#fffdf7" stroke="#d9c7a9" stroke-width="2"><ellipse cy="-25" rx="15" ry="32"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(72)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(144)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(216)"/><ellipse cy="-25" rx="15" ry="32" transform="rotate(288)"/><circle r="10" fill="#d9b86f" stroke="none"/></g>
