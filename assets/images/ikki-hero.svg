<ellipse cx="535" cy="570" rx="310" ry="390" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".6" transform="rotate(17 535 570)"/>
<ellipse cx="535" cy="570" rx="342" ry="420" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6" transform="rotate(-18 535 570)"/>
<circle cx="825" cy="250" r="4" fill="#b8935f"/><circle cx="224" cy="690" r="3" fill="#b8935f"/><circle cx="760" cy="890" r="3" fill="#b8935f"/>
<!-- pedestal -->
<ellipse cx="535" cy="1015" rx="280" ry="52" fill="#756047" opacity=".22" filter="url(#shadow)"/>
<path d="M230 890 805 890 900 1090 135 1090Z" fill="url(#stone)"/>
<path d="M230 890 805 890 785 923 248 923Z" fill="#fffaf1"/>
<path d="M135 1090h765" stroke="#aa8c60" stroke-width="2" opacity=".55"/>
<path d="M180 1035c190-26 380 34 650-4" fill="none" stroke="#b49c78" stroke-width="2" opacity=".35"/>
<!-- bottle shadow -->
<ellipse cx="520" cy="900" rx="170" ry="32" fill="#5c4c38" opacity=".24" filter="url(#soft)"/>
<!-- bottle cap -->
<rect x="414" y="178" width="214" height="194" rx="26" fill="url(#cap)"/>
<rect x="428" y="190" width="14" height="166" rx="7" fill="#fff" opacity=".12"/>
<rect x="604" y="190" width="8" height="166" rx="4" fill="#fff" opacity=".1"/>
<rect x="405" y="355" width="232" height="48" rx="9" fill="#171614"/>
<path d="M420 365h202" stroke="#a88958" stroke-width="2" opacity=".6"/>
