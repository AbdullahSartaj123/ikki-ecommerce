<rect x="306" y="382" width="430" height="520" rx="48" fill="url(#glass)" stroke="#fff" stroke-width="9"/>
<rect x="318" y="394" width="406" height="496" rx="39" fill="url(#liquid)" stroke="#b8a78f" stroke-opacity=".48" stroke-width="2"/>
<path d="M329 428c8-25 19-33 37-34v456c-23-8-37-24-37-48Z" fill="#fff" opacity=".44"/>
