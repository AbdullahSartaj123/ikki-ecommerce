<rect x="360" y="492" width="322" height="318" rx="4" fill="#fffdf8" stroke="#d2c3ac" stroke-width="2"/>
<text x="521" y="560" fill="#171614" text-anchor="middle" font-family="Georgia,serif" font-size="52" letter-spacing="9">IKKI</text>
<path d="M393 586h256" stroke="url(#gold)" stroke-width="2"/>
<rect x="394" y="608" width="254" height="156" fill="url(#teal)"/>
<path d="M394 700c70-68 125 15 254-58v122H394Z" fill="#0b393b" opacity=".58"/>
<path d="M394 662c62-48 118 36 254-18" fill="none" stroke="#7ec0b6" stroke-width="3" opacity=".6"/>
<path d="M394 727c75-51 137 16 254-44" fill="none" stroke="#b0d1c7" stroke-width="2" opacity=".45"/>
<text x="521" y="791" fill="#6d6252" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" letter-spacing="5">EAU DE PARFUM</text>
<!-- falling petals -->
<g fill="#fffdf8" stroke="#d9c5a5" stroke-width="1.5"><path d="M205 775c-21-23-17-48 10-60 20 24 18 44-10 60Z"/><path d="M840 770c-20-19-20-42 4-58 21 20 20 40-4 58Z"/><path d="M735 430c-17-18-13-37 8-48 16 18 14 34-8 48Z"/></g>
<text x="70" y="1120" fill="#94774c" font-family="Arial,sans-serif" font-size="13" letter-spacing="5">THE ART OF FRAGRANCE</text>
<text x="930" y="1120" text-anchor="end" fill="#94774c" font-family="Arial,sans-serif" font-size="13" letter-spacing="5">IKKI · EST. 2026</text>
</svg>